# Dependabot dependency update policy.
# Keep ecosystem paths aligned with the manifests in this repository.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: pip
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Major bumps of the heavy ML stack need a deliberate migration.
      - dependency-name: torch
        update-types: ["version-update:semver-major"]
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: mlflow
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: npm
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      frontend-build:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["vite", "@vitejs/*", "tailwindcss", "postcss", "autoprefixer"]
      frontend-runtime:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["react", "react-dom", "recharts"]
      electron:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["electron", "electron-builder"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      # Catch-all prevents ungrouped minor/patch dependencies from creating
      # one PR apiece. Major updates remain separate for safer review.
      frontend-other:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: actions
    cooldown:
      default-days: 3
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]

  # Updates Dockerfile image tags and digests; CI image scanning remains the
  # final check that an updated base image is acceptable.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: docker
    cooldown:
      default-days: 3
