# Registry: GOV-067 (config/quality_registry.json).
name: Codex PR handoff

# Claude opens a pull request and then stops touching it. ChatGPT Codex owns
# it from there until the merge queue lands it: Codex code review reviews each
# push (configured in ChatGPT Codex settings, not here), and this workflow asks
# Codex to fix a failing check or its own review findings by commenting
# `@codex fix ...` on the pull request. The rules Codex follows are in
# AGENTS.md ("Code Review Rules", "Pull request handoff").
#
# Nothing here runs Claude (GOV-036). Nothing here merges, arms auto-merge or
# re-queues a pull request (GOV-037): the owner arms auto-merge.
#
# workflow_run fires only once this file is on the default branch, and both
# triggers run the default branch's script, never the pull request's code.

on:
  workflow_run:
    workflows:
      - "CI"
      - "CodeQL"
      - "Security"
      - "Workflow lint"
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  # One decision per pull request at a time, so two failing workflows on the
  # same head cannot both see "no request yet" and both post one.
  group: codex-pr-handoff-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  handoff:
    # Only a failed same-repository pull-request run, or a review written by
    # the Codex connector. Everything else exits before a token is touched.
    # Dependabot's runs get no repository secrets and its pull requests are
    # not Claude's, so they are left to the owner.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.actor.login != 'dependabot[bot]'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'chatgpt-codex-connector[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the default-branch handoff script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Ask Codex to fix the pull request
        env:
          # The owner's token, not GITHUB_TOKEN: Codex acts on an @codex
          # mention from a person with Codex access, not from
          # github-actions[bot]. Needs pull-request and issue write on this
          # repository only. Missing token fails the run and posts nothing.
          CODEX_HANDOFF_TOKEN: ${{ secrets.CODEX_HANDOFF_TOKEN }}
        # Until this lands on the default branch the script is not there to
        # run; pull_request_review uses the pull request's copy of this file.
        run: |
          if [ ! -f scripts/codex_pr_handoff.py ]; then
            echo "Handoff script is not on the default branch yet; nothing to do."
            exit 0
          fi
          python3 scripts/codex_pr_handoff.py
