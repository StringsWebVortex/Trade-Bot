# Pyre type checking and GitHub code scanning.
name: Pyre

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

jobs:
  pyre:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # The upstream Pyre action uses a floating Python constraint (>=3.6),
      # which resolves to the newest Python release rather than this project's
      # supported 3.11. Set up the repository's declared interpreter explicitly.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Pyre and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyre-check
          python -m pip install -r requirements.txt

      - name: Set up Pyre configuration
        run: |
          if [ ! -f .pyre_configuration ]; then
            printf '{\n  "source_directories": ["."]\n}\n' > .pyre_configuration
          fi

      - name: Run Pyre
        run: pyre --noninteractive --output=sarif check > sarif.json

      - name: Save SARIF results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF Results
          path: sarif.json
          if-no-files-found: ignore

      - name: Upload SARIF results
        if: always() && hashFiles('sarif.json') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif.json

  gate:
    name: Pyre gate
    if: always()
    needs: [pyre]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert Pyre succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/assert_jobs_green.py
